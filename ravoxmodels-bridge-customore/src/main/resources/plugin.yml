name: RavoxModelsCustomOreBridge
main: com.ravox.models.bridge.customore.CustomOreBridgePlugin
version: ${project.version}
api-version: "26.1.1"
authors: [Ravox]
depend: [RavoxModels]
softdepend: [CustomOrePlugin]
commands:
  rvxbridge:
    description: RavoxModels bridge diagnostics and phase simulation
    usage: /rvxbridge phase <handleUuid> <currentHp> <maxHp>
    permission: ravoxmodels.bridge.admin
permissions:
  ravoxmodels.bridge.admin:
    description: Admin access to RavoxModels bridge commands
    default: op
