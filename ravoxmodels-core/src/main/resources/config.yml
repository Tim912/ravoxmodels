version: 26.1

namespace:
  prefix: rvxmodels

import:
  directory: plugins/RavoxModels/import
  auto_watch: true
  rebuild_pack_on_success: true
  force_pack_after_build: false
  accepted_extensions:
    - glb
    - fbx

resourcepack:
  enabled: true
  force: true
  auto_apply_on_join: true
  hosted_url: ""
  pack_format: 84
  description: RavoxModels generated pack
  host:
    enabled: true
    public_host: 127.0.0.1
    port: 8777
    path: /ravoxmodels/pack.zip

license:
  enabled: false
  api_url: ""
  key: ""
  product: ravoxmodels
  server_id: ""
  timeout_ms: 5000
  heartbeat_minutes: 30
  grace_hours: 48

runtime:
  item_material: STICK

limits:
  max_triangles: 15000
  max_bones: 32
  max_texture_size: 2048
