version: 26.1

namespace:
  prefix: rvxmodels

import:
  directory: import
  auto_watch: true
  rebuild_pack_on_success: true
  force_pack_after_build: false
  accepted_extensions:
    - glb
    - fbx

resourcepack:
  enabled: true
  force: true
  auto_apply_on_join: true
  join_send_delay_ticks: 40
  retry_delay_ticks: 60
  max_download_retries: 2
  tracking_ttl_seconds: 300
  safety_block_localhost_url: true
  hosted_url: ""
  model_namespace: rvxmodels
  pack_format: 84
  supported_formats_min: 84
  supported_formats_max: 32767
  preview_texture_max_size: 256
  description: RavoxModels generated pack
  host:
    enabled: true
    public_host: 127.0.0.1
    port: 8777
    path: /ravoxmodels/pack.zip

license:
  enabled: false
  api_url: ""
  key: ""
  product: ravoxmodels
  server_id: ""
  timeout_ms: 5000
  heartbeat_minutes: 30
  grace_hours: 48

runtime:
  item_material: STICK

converter:
  strict: true
  command:
    enabled: true
    shell: auto
    timeout_seconds: 900
    strict_exit_code: true
    require_report: false
    # Placeholders: {input} {output} {model_id} {model_dir} {plugin_dir} {runtime_dir} {format} {namespace}
    glb: "py -3 {converter_backend} --input {input} --output {output} --model {model_id} --format {format} --namespace {namespace} --max-elements 256 --voxel-grid 20 --palette-size 16 --strict"
    # fbx can be separate command or same script with --format fbx
    fbx: "py -3 {converter_backend} --input {input} --output {output} --model {model_id} --format {format} --namespace {namespace} --max-elements 256 --voxel-grid 20 --palette-size 16 --strict"

tools:
  install_bundled_converter: true
  overwrite_on_start: false

limits:
  max_triangles: 15000
  max_bones: 32
  max_texture_size: 2048
